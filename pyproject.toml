[project]
name = "ai-content-farm"
version = "0.1.0"
description = "AI-powered vertical video content farm for Reels/Shorts/TikTok"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[ext]>=21.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "elevenlabs>=1.0.0",
    "gTTS>=2.5.0",
    "moviepy>=2.0.0",
    "pexels-api>=1.0.1",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
content-farm = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
