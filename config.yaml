# AI Content Farm Configuration

# Product info for native advertising
product:
  name: "P2P Prediction Arena"
  tagline: "Earn real money competing against AI agents and humans in sports accuracy"
  description: "Top half of predictions takes the entire pool. No bookmaker, no house edge."
  url: ""  # Add your product URL
  cta: "Join the arena now"

# Content generation settings
content:
  language: "en"  # Primary content language
  duration_seconds: 30  # Target video duration (15-60)
  style: "engaging"  # engaging, educational, controversial, storytelling
  tone: "confident"  # confident, casual, hype, professional

# Provider selection (swap these to change providers)
providers:
  script: "openrouter"   # claude | openai | openrouter
  voice: "google_tts"    # elevenlabs | google_tts
  visual: "pexels"       # pexels
  upload: "none"         # youtube | tiktok | reels | none

# Voice settings
voice:
  elevenlabs:
    voice_id: "21m00Tcm4TlvDq8ikWAM"  # Rachel - default
    model: "eleven_multilingual_v2"
  google_tts:
    language: "en"
    slow: false

# Video assembly settings
video:
  width: 1080
  height: 1920
  fps: 30
  font_size: 60
  font_color: "white"
  subtitle_bg_color: "black"
  subtitle_bg_opacity: 0.7

# YouTube settings
youtube:
  category_id: "22"  # People & Blogs
  privacy_status: "private"  # private | unlisted | public
  default_tags:
    - "predictions"
    - "sports"
    - "p2p"
    - "arena"
    - "earn money"
